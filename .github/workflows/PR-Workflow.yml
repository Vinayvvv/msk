name: PR Testing Gate

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-index: '20'
          cache: 'npm' 
      - name: Run test cases
        run: npm version          
